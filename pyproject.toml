[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "evidline"
version = "0.0.0"
description = "Local-first verified context and mutation boundary for AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
evidline = "evidline.cli:main"
evidline-claude-hook = "evidline.adapters.claude:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evidline"]
